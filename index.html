<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>English Study</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">PERSONAL ENGLISH STUDY</p>
      <h1>English Study</h1>
    </div>
    <span id="syncStatus" class="status">準備中</span>
  </header>

  <main class="container">
    <section class="hero-card">
      <div>
        <p class="eyebrow">TODAY</p>
        <h2>英語を、少しずつ。</h2>
        <p>単語を登録して、あとから復習できる自分専用の英語学習帳です。</p>
      </div>
      <button id="addWordButton" class="primary-button">＋ 単語を追加</button>
    </section>

    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="単語・意味・例文を検索" aria-label="単語を検索" />
      <select id="difficultyFilter" aria-label="難易度で絞り込み">
        <option value="">すべての難易度</option>
        <option value="1">★</option>
        <option value="2">★★</option>
        <option value="3">★★★</option>
        <option value="4">★★★★</option>
        <option value="5">★★★★★</option>
      </select>
    </section>

    <section class="stats-grid">
      <article class="stat-card"><span>登録単語</span><strong id="wordCount">0</strong></article>
      <article class="stat-card"><span>今日の学習</span><strong id="todayCount">0</strong></article>
      <article class="stat-card"><span>要復習</span><strong id="reviewCount">0</strong></article>
    </section>

    <section>
      <div class="section-heading">
        <h2>単語一覧</h2>
        <button id="refreshButton" class="text-button">更新</button>
      </div>
      <div id="wordList" class="word-list"></div>
      <p id="emptyState" class="empty-state">まだ単語がありません。「＋ 単語を追加」から登録しましょう。</p>
    </section>
  </main>

  <dialog id="wordDialog">
    <form id="wordForm" method="dialog" class="word-form">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">WORD</p>
          <h2 id="dialogTitle">単語を追加</h2>
        </div>
        <button type="button" id="closeDialog" class="icon-button" aria-label="閉じる">×</button>
      </div>

      <input type="hidden" id="wordId" />
      <label>英単語<input id="word" required autocomplete="off" /></label>
      <label>日本語訳<input id="meaning" required /></label>
      <label>品詞<input id="partOfSpeech" placeholder="名詞 / 動詞 / 形容詞…" /></label>
      <label>発音記号<input id="pronunciation" placeholder="/əˈbændən/" /></label>
      <label>例文<textarea id="example" rows="3"></textarea></label>
      <label>例文の日本語訳<textarea id="exampleTranslation" rows="3"></textarea></label>
      <label>難易度
        <select id="difficulty">
          <option value="1">★</option><option value="2">★★</option><option value="3" selected>★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option>
        </select>
      </label>
      <label>メモ<textarea id="memo" rows="3"></textarea></label>

      <div class="form-actions">
        <button type="button" id="deleteButton" class="danger-button hidden">削除</button>
        <span></span>
        <button type="button" id="cancelButton" class="secondary-button">キャンセル</button>
        <button type="submit" class="primary-button">保存</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
