<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eeeef8" />
  <title>English Study</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">E</span><div><p>PERSONAL</p><h1>English Study</h1></div></div>
      <div class="profile-dot">A</div>
    </header>
    <main class="dashboard">
      <section class="welcome-card">
        <div><p class="kicker">YOUR ENGLISH WORKSPACE</p><h2>Learn English,<br /><span>your way.</span></h2><p>Speaking, listening, writing and readingを、ひとつの場所で管理。</p></div>
        <div class="decor-orb orb-one"></div><div class="decor-orb orb-two"></div>
      </section>
      <section class="main-tabs" aria-label="学習カテゴリー">
        <button class="main-tab active" data-main-tab="speaking">Speaking</button>
        <button class="main-tab" data-main-tab="listening">Listening</button>
        <button class="main-tab" data-main-tab="writing">Writing</button>
        <button class="main-tab" data-main-tab="reading">Reading</button>
      </section>
      <section class="workspace-card">
        <div class="workspace-head"><div><p class="kicker" id="workspaceKicker">SPEAKING</p><h2 id="workspaceTitle">Speaking</h2></div><button id="newTabButton" class="new-button"><span>＋</span> 新規作成</button></div>
        <div id="subTabs" class="sub-tabs" role="tablist" aria-label="サブタブ"></div>
        <div class="workspace-content">
          <div class="content-icon" id="contentIcon">🎙️</div><h3 id="contentTitle">新しいSpeaking学習を始めよう</h3><p id="contentDescription">このカテゴリーの中に、自分専用の学習タブを追加できます。</p>
          <div class="content-placeholder"><span>Coming next</span><strong>ここに学習コンテンツを追加していきます</strong></div>
        </div>
      </section>
      <section class="quick-stats"><article><span>今日の学習</span><strong>0 <small>min</small></strong></article><article><span>作成したタブ</span><strong id="tabCount">4</strong></article><article><span>Learning streak</span><strong>0 <small>days</small></strong></article></section>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
